name: Check plugins
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Studio tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/framebridge-rojo"
          curl --fail --location --silent --show-error https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip --output "$RUNNER_TEMP/framebridge-rojo/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $RUNNER_TEMP/framebridge-rojo/rojo.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/framebridge-rojo/rojo.zip" -d "$RUNNER_TEMP/framebridge-rojo"
          chmod +x "$RUNNER_TEMP/framebridge-rojo/rojo"
          curl --fail --location --silent --show-error https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip --output "$RUNNER_TEMP/framebridge-rojo/lune.zip"
          echo "ffba0bd404ae078c9543ef5ac12479938a741aab255768a11a08517ae963b288  $RUNNER_TEMP/framebridge-rojo/lune.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/framebridge-rojo/lune.zip" -d "$RUNNER_TEMP/framebridge-rojo"
          chmod +x "$RUNNER_TEMP/framebridge-rojo/lune"
          echo "$RUNNER_TEMP/framebridge-rojo" >> "$GITHUB_PATH"
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run check:secrets
      - run: npm run beta:dry-run
      - run: npm run beta:oauth:dry-run
      - run: npm run test:studio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Framebridge-plugins
          path: dist/Framebridge-plugins.zip
          if-no-files-found: error
          retention-days: 14
